<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 644" width="1580" height="644"><rect width="1580" height="644" fill="#ffffff"/><text x="30" y="40" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#1c1b19">Two-Stage Training Architecture</text><text x="30" y="64" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#6b675f">Left-to-right overview: two data sources &#8594; preprocessing &#8594; plaintext distribution learning &#8594; conditional fine-tuning &#8594; evaluation.</text><text x="30" y="104" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e" letter-spacing="1.3">DATA PREPROCESSING</text><text x="560" y="104" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#3b5bdb" letter-spacing="1.3">STAGE 1 · DISTRIBUTION LEARNING</text><text x="1000" y="104" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#c2560f" letter-spacing="1.3">STAGE 2 · CONDITIONAL FINE-TUNING</text><text x="1400" y="104" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#15803d" letter-spacing="1.3">EVALUATION</text><line x1="542" y1="118" x2="542" y2="566" stroke="#c9c3b7" stroke-width="1" stroke-dasharray="3 5"/><line x1="972" y1="118" x2="972" y2="566" stroke="#c9c3b7" stroke-width="1" stroke-dasharray="3 5"/><line x1="1388" y1="118" x2="1388" y2="566" stroke="#c9c3b7" stroke-width="1" stroke-dasharray="3 5"/><rect x="590" y="120" width="170" height="40" rx="11" fill="#ffffff" stroke="#8a857b" stroke-width="1.5"/><text x="675.0" y="138.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#1c1b19" text-anchor="middle">Base LLM</text><text x="675.0" y="154.0" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#6b675f" text-anchor="middle">Mistral-7B · Qwen3-4B</text><rect x="560" y="170" width="230" height="112" rx="14" fill="#eef1fd" stroke="#3b5bdb" stroke-width="2.4"/><circle cx="584" cy="194" r="14" fill="#3b5bdb"/><text x="584" y="198.5" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="675.0" y="226" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#1c1b19" text-anchor="middle">Plaintext Distribution</text><text x="675.0" y="246" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#1c1b19" text-anchor="middle">Learning</text><text x="675.0" y="267" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#6b675f" text-anchor="middle">full FT · no LoRA · p(password)</text><rect x="812" y="201" width="120" height="50" rx="11" fill="#ffffff" stroke="#8a857b" stroke-width="1.5"/><text x="872.0" y="224.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#1c1b19" text-anchor="middle">Distribution model</text><text x="872.0" y="240.0" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#6b675f" text-anchor="middle">final/</text><rect x="1000" y="170" width="230" height="112" rx="14" fill="#fbeadd" stroke="#c2560f" stroke-width="2.4"/><circle cx="1024" cy="194" r="14" fill="#c2560f"/><text x="1024" y="198.5" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1115.0" y="226" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#1c1b19" text-anchor="middle">Conditional Targeted</text><text x="1115.0" y="246" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#1c1b19" text-anchor="middle">Fine-tuning</text><text x="1115.0" y="267" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#6b675f" text-anchor="middle">QLoRA · tags → password</text><rect x="1252" y="201" width="118" height="50" rx="11" fill="#ffffff" stroke="#8a857b" stroke-width="1.5"/><text x="1311.0" y="224.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#1c1b19" text-anchor="middle">Final model</text><text x="1311.0" y="240.0" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#6b675f" text-anchor="middle">lora_final</text><rect x="1400" y="170" width="150" height="112" rx="14" fill="#e8f5ec" stroke="#15803d" stroke-width="2.4"/><circle cx="1424" cy="194" r="14" fill="#15803d"/><text x="1424" y="198.5" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1475.0" y="226" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#1c1b19" text-anchor="middle">Evaluation</text><text x="1475.0" y="246" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#1c1b19" text-anchor="middle"></text><text x="1475.0" y="267" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#6b675f" text-anchor="middle">crack rate @K</text><path d="M675.0 160.0 L675.0 170.0" fill="none" stroke="#6b675f" stroke-width="2"/><path d="M675.0 170.0 L670.6 162.0 L679.4 162.0 Z" fill="#6b675f"/><path d="M790.0 226.0 L812.0 226.0" fill="none" stroke="#6b675f" stroke-width="2"/><path d="M812.0 226.0 L804.0 230.4 L804.0 221.6 Z" fill="#6b675f"/><path d="M932.0 226.0 L1000.0 226.0" fill="none" stroke="#c2560f" stroke-width="2.2" stroke-dasharray="6 4"/><path d="M1000.0 226.0 L992.0 230.4 L992.0 221.6 Z" fill="#c2560f"/><path d="M1230.0 226.0 L1252.0 226.0" fill="none" stroke="#6b675f" stroke-width="2"/><path d="M1252.0 226.0 L1244.0 230.4 L1244.0 221.6 Z" fill="#6b675f"/><path d="M1370.0 226.0 L1400.0 226.0" fill="none" stroke="#6b675f" stroke-width="2"/><path d="M1400.0 226.0 L1392.0 230.4 L1392.0 221.6 Z" fill="#6b675f"/><text x="560" y="306" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">Full-parameter fine-tuning on ~2.74M</text><text x="560" y="321" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">cleaned passwords; learns the</text><text x="560" y="336" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">unconditional distribution p(password)</text><text x="560" y="351" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">via causal-LM cross-entropy.</text><text x="1010" y="306" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">Initialized from the Stage-1 model.</text><text x="1010" y="321" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">QLoRA conditions generation on PCFG</text><text x="1010" y="336" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">tags (tags → password); loss on</text><text x="1010" y="351" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">password tokens only.</text><text x="1400" y="306" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">Targeted guessing; crack</text><text x="1400" y="321" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">rate at K = 1 / 10 / 100</text><text x="1400" y="336" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">/ 1000 candidates.</text><rect x="30" y="338" width="150" height="44" rx="11" fill="#ffffff" stroke="#8a857b" stroke-width="1.5"/><text x="105.0" y="358.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#1c1b19" text-anchor="middle">Raw passwords</text><text x="105.0" y="374.0" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#6b675f" text-anchor="middle">datasets/*.txt</text><rect x="200" y="338" width="160" height="44" rx="11" fill="#ffffff" stroke="#c9c3b7" stroke-width="1.5"/><text x="280.0" y="358.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#1c1b19" text-anchor="middle">Clean / filter</text><text x="280.0" y="374.0" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#6b675f" text-anchor="middle">dedup · strip-test</text><rect x="380" y="336" width="160" height="48" rx="11" fill="#e4f2f0" stroke="#0f766e" stroke-width="2"/><text x="460.0" y="358.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Plaintext corpus</text><text x="460.0" y="374.0" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#6b675f" text-anchor="middle">≈ 2.74M rows</text><path d="M180.0 360.0 L200.0 360.0" fill="none" stroke="#6b675f" stroke-width="2"/><path d="M200.0 360.0 L192.0 364.4 L192.0 355.6 Z" fill="#6b675f"/><path d="M360.0 360.0 L380.0 360.0" fill="none" stroke="#6b675f" stroke-width="2"/><path d="M380.0 360.0 L372.0 364.4 L372.0 355.6 Z" fill="#6b675f"/><rect x="30" y="456" width="150" height="44" rx="11" fill="#ffffff" stroke="#8a857b" stroke-width="1.5"/><text x="105.0" y="476.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#1c1b19" text-anchor="middle">JSON data</text><text x="105.0" y="492.0" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#6b675f" text-anchor="middle">sibling·pii·others</text><rect x="198" y="450" width="162" height="58" rx="12" fill="#fbfaf7" stroke="#b9b3a7" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="206" y="437" width="92" height="24" rx="12" fill="#0f766e"/><text x="217" y="453" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#fff">module</text><rect x="208" y="470" width="66" height="32" rx="11" fill="#ffffff" stroke="#c9c3b7" stroke-width="1.5"/><text x="241.0" y="491.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#1c1b19" text-anchor="middle">Split</text><rect x="286" y="470" width="66" height="32" rx="11" fill="#ffffff" stroke="#c9c3b7" stroke-width="1.5"/><text x="319.0" y="491.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#1c1b19" text-anchor="middle">Tag</text><path d="M274.0 486.0 L286.0 486.0" fill="none" stroke="#6b675f" stroke-width="2"/><path d="M286.0 486.0 L278.0 490.4 L278.0 481.6 Z" fill="#6b675f"/><rect x="380" y="454" width="160" height="50" rx="11" fill="#e4f2f0" stroke="#0f766e" stroke-width="2"/><text x="460.0" y="477.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Conditional data</text><text x="460.0" y="493.0" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#6b675f" text-anchor="middle">split + PCFG tag</text><path d="M180.0 478.0 L208.0 478.0" fill="none" stroke="#6b675f" stroke-width="2"/><path d="M208.0 478.0 L200.0 482.4 L200.0 473.6 Z" fill="#6b675f"/><path d="M352.0 478.0 L380.0 478.0" fill="none" stroke="#6b675f" stroke-width="2"/><path d="M380.0 478.0 L372.0 482.4 L372.0 473.6 Z" fill="#6b675f"/><text x="30" y="542" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">Two sources. Plaintext passwords are cleaned (dedup, length/charset filter,</text><text x="30" y="557" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">test-overlap removal). Structured JSON (sibling / PII / other) enters a module that</text><text x="30" y="572" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f">first segments passwords into tokens (Split) and then assigns PCFG tags (Tag).</text><path d="M540.0 356.0 L560.0 262.0" fill="none" stroke="#0f766e" stroke-width="2"/><path d="M560.0 262.0 L562.6 270.7 L554.0 268.9 Z" fill="#0f766e"/><text x="500" y="322" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#0f766e" text-anchor="start">plaintext</text><path d="M540.0 479.0 L986.0 479.0 L986.0 256.0 L1000.0 256.0" fill="none" stroke="#0f766e" stroke-width="2"/><path d="M1000.0 256.0 L992.0 260.4 L992.0 251.6 Z" fill="#0f766e"/><text x="762" y="471" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#0f766e" text-anchor="middle">conditional (tags)</text><line x1="30" y1="600" x2="64" y2="600" stroke="#c2560f" stroke-width="2.2" stroke-dasharray="6 4"/><text x="72" y="604" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b675f" text-anchor="start">weight reuse: the Stage-1 model initializes Stage-2.</text><text x="30" y="626" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-style="italic" fill="#6b675f">Figure 1. Two-stage pipeline: unconditional plaintext distribution learning (Stage 1) followed by PCFG-tag-conditioned targeted fine-tuning (Stage 2).</text></svg>