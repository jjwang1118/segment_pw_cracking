.0 330.0" fill="none" stroke="#1f2328" stroke-width="1.5"/><path d="M1544.0 330.0 L1539.8 323.0 L1548.2 323.0 Z" fill="#1f2328"/><rect x="1410" y="330" width="270" height="48" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.3"/><text x="1545.0" y="353.0" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">crack rate @ K</text><text x="1545.0" y="368.0" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#555b61" text-anchor="middle">K = 1 / 10 / 100 / 1000</text><text x="24" y="512" font-family="DejaVu Sans, sans-serif" font-size="12" font-style="italic" fill="#555b61">Figure 1. Two-stage pipeline: plaintext passwords train unconditional distribution learning (Stage 1); its weights initialise a PCFG-tag-conditioned LoRA fine-tuning (Stage 2); the trained model is then evaluated by targeted guessing.</text></svg>