search_type: constrative_search # 根據search_type選擇對應的搜尋方法配置

contrastive_search:
  search_kind: contrastive
  beam_width: [95, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000]
  batch_size: 1000
  prompt_template_id: 1
  vocab_limit: true
  precistion: half
  eos_threshold: 0.000001
  max_guess_number: 1000
  min_len: 8
  output_path: gen
  output_file_name: contrastive_search_results.jsonl

eval:
  model_path: checkpoints/Llama-3.2-3B-Instruct/run_2/lora_final
  # eval-only fields (used by run_eval.py, ignored by run_search.py)
  test_data_path: datasets/processed/split/test_data.jsonl
  max_eval_samples: 500       # 外層迴圈：評估幾筆測試密碼（全量 53K 太慢）
  eval_output_file_name: eval_results.jsonl