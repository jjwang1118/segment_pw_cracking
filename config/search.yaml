search_type: constrained_beam_search # 根據search_type選擇對應的搜尋方法配置

contrastive_search:
  search_kind: contrastive
  beam_width: [ 95, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500, 500 ]
  #[ 95, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000 ]
  batch_size: 500
  prompt_template_id: 3
  vocab_limit: true
  precistion: half
  eos_threshold: 0.0001
  max_guess_number: 50
  min_len: 8
  output_path: gen
  output_file_name: contrastive_search_results.jsonl

dynamic_beam_search:
  beam_width: [  95, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000]
  #[ 95, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000 ]
  batch_size: 1000
  prompt_template_id: 5
  vocab_limit: true
  precistion: half
  eos_threshold: 0.001
  max_guess_number: 1000
  min_len: 8
  output_path: gen
  output_file_name: dynamic_beam_search_results.jsonl

constrained_beam_search:
  beam_width: 1000          # single int — per-step cap auto-computed from char-class size
  search_width: 1000
  batch_size: 1000
  prompt_template_id: 5
  precistion: half
  max_guess_number: 1000
  fallback_to_dynamic: true # run_eval: fallback to dynamic_beam_search when pos/semantic tags present
  output_path: gen
  output_file_name: constrained_beam_search_results.jsonl
  tags: "char5|number3|special1"  # run_search.py only — structure to generate

constrained_contrastive_search:
  beam_width: 1000          # single int — per-step cap auto-computed from char-class size
  search_width: 1000
  batch_size: 100
  prompt_template_id: 3
  precistion: half
  max_guess_number: 1000
  use_contrastive: true
  contrastive_alpha: 0.6
  fallback_to_dynamic: true # fallback to contrastive_search when pos/semantic tags present
  output_path: gen
  output_file_name: constrained_contrastive_search_results.jsonl

eval:
  model_path: checkpoints/Mistral-7B-v0.1/run_18/lora_final_2900
  #checkpoints/Llama-3.2-3B-Instruct/run_4/lora_final
  # eval-only fields _contrastive.jsonl
  test_data_path: datasets/processed/semanticPCFG/COMB/backoff/split/test_data.jsonl
  max_eval_samples: 5000 # 外層迴圈：評估幾筆測試密碼（全量 53K 太慢）
  eval_output_file_name: eval_results_id5_run_18_Mistral7B_id5_COMB.jsonl

