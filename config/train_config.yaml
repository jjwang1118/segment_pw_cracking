seed: 42
dataset_path: datasets/processed/semanticPCFG/000webhost/backoff
segment_tag_path:
  path: gen/semanticPCFG
  kind: backoff # 可選：pos / backoff / pos_semantic
  dataset: [ 000webhost ] # 自行調整

expected_ratio: 0.4
split_ratio: 0.2

# LoRA 種類：lora（標準 bf16 LoRA）或 qlora（4-bit 量化，適用 7B+ 模型）
lora_kind: lora

# 只在 lora_kind=qlora 時自動蓋掉 train_config 對應值
qlora_train_overrides:
  bf16: false
  optim: paged_adamw_8bit

train:
  prompt_template_id: 5

  train_config:
    model_name: Mistral-7B-v0.1 #Llama-3.2-3B-Instruct
    model_path: models
    output_dir: checkpoints
    per_device_train_batch_size: 64
    gradient_accumulation_steps: 64
    weight_decay: 0.01
    learning_rate: "2e-4"
    num_train_epochs: 10
    warmup_ratio: 0.1
    logging_steps: 10
    save_steps: 20
    data_seed: 42
    seed: 42
    bf16: true
    eval_strategy: steps
    eval_steps: 20
    per_device_eval_batch_size: 32
    eval_delay: 1
    optim: adamw_torch
    label_smoothing_factor: 0

  lora_config:
    r: 16
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    lora_alpha: 32
    lora_dropout: 0.2
    bias: none
    init_lora_weights: true
