seed: 42
dataset_path: datasets/processed
segment_tag_path:
  path: gen/tagged
  kind: backoff # 可選：pos / backoff / pos_semantic
  dataset: [ hotmail, phpbb, 000webhost ] # 自行調整

expected_ratio: 0.4
split_ratio: 0.2

train:
  prompt_template_id: 1

  train_config:
    model_name: Llama-3.2-3B-Instruct
    model_path: models
    output_dir: checkpoints
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 64
    weight_decay: 0.01
    learning_rate: "5e-4"
    num_train_epochs: 3
    warmup_ratio: 0.1
    logging_steps: 10
    save_steps: 200
    data_seed: 42
    seed: 42
    bf16: true
    eval_strategy: steps
    eval_steps: 100
    per_device_eval_batch_size: 4
    eval_delay: 1
    optim: adamw_torch
    label_smoothing_factor: 0

  lora_config:
    r: 16
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    lora_alpha: 32
    lora_dropout: 0.2
    bias: none
    init_lora_weights: true
